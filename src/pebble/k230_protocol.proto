// K230 <-> nRF Communication Protocol

syntax = "proto2";
package k230;

// nRF - K230 messages
message NrfToK230 {
  oneof msg {
    RawKeyboardEvent keyboard = 1;
    RawTouchpadEvent touchpad = 2;
    RedrawDisplay redraw_display = 3;
    FormattedKeypress formatted_keypress = 4;
  }
}

enum FormattedLayer {
  FORMATTED_LAYER_NONE = 0;
  FORMATTED_LAYER_SHIFT = 1;
  FORMATTED_LAYER_PHYS_ALT = 2;
  FORMATTED_LAYER_SYM = 3;
}

message RawKeyboardEvent {
  required uint32 keycode = 1;
  required bool is_down = 2;
}

message FormattedKeypress {
  required uint32 base_keycode = 1;
  required FormattedLayer layer = 2;
  required bool control = 3;
  required bool alt = 4;
}

message RawTouchpadEvent {
  required int32 delta_x = 1;
  required int32 delta_y = 2;
  required uint32 surface_qual = 3;
}

message RedrawDisplay {}

// K230 - nRF messages
message K230ToNrf {
  oneof msg {
    Disconnect disconnect = 1;
  }
}

message Disconnect {}

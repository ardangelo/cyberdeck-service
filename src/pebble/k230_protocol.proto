// K230 <-> nRF Communication Protocol

syntax = "proto2";
package k230;

// nRF - K230 messages
message NrfToK230 {
  oneof msg {
    RawKeyboardEvent keyboard = 1;
    RawTouchpadEvent touchpad = 2;
    RedrawDisplay redraw_display = 3;
  }
}

message RawKeyboardEvent {
  required uint32 keycode = 1;
  required bool is_down = 2;
}

message RawTouchpadEvent {
  required int32 delta_x = 1;
  required int32 delta_y = 2;
  required uint32 surface_qual = 3;
}

message RedrawDisplay {}

// K230 - nRF messages
message K230ToNrf {
  oneof msg {
    Disconnect disconnect = 1;
  }
}

message Disconnect {}
